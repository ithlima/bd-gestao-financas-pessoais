spring.application.name=financas

# ===============================
# DATABASE - MARIADB
# ===============================

spring.datasource.url=jdbc:mariadb://localhost:3306/financas
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================

# ddl-auto=update: o Hibernate cria tabelas e colunas que faltam, mas NÃO remove
# tabelas órfãs nem cria as restrições CHECK. Por isso existe o script
# src/main/resources/db/migration/V2__evolucao_dre_titulos.sql, que registra a
# evolução do modelo de forma explícita e reproduzível.
spring.jpa.hibernate.ddl-auto=update

# Mostra o SQL gerado. Útil para estudo; em produção, deixe como false.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Deixa explícito que não usamos as anotações de geração de schema do Hibernate
# (não há @Index/@Check nos scripts): o script SQL é a fonte de verdade.
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=none

# ===============================
# OPEN SESSION IN VIEW
# ===============================

# Desligado de propósito. Com open-in-view=true, o Hibernate mantém a sessão (e
# a conexão com o banco) aberta durante a renderização da resposta, o que
# esconde consultas preguiçosas feitas fora da transação e segura conexões sem
# necessidade.
#
# Este projeto não precisa disso: todos os mappers convertem entidade -> DTO
# DENTRO da transação do service, então nenhuma consulta LAZY é disparada durante
# a serialização do JSON. Desligar torna esse erro visível em vez de silencioso.

spring.jpa.open-in-view=false

server.port=8080
