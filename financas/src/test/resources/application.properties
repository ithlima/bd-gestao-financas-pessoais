spring.application.name=financas-test

# ===============================
# BANCO DE TESTE
# ===============================
#
# Os testes de integração usam um banco separado do de desenvolvimento
# (financas_test, em vez de financas). Rodar os testes nunca mexe nos dados reais.
#
# `createDatabaseIfNotExist=true` faz o próprio driver criar o banco na primeira
# conexão, então não é preciso nenhum passo manual de preparação.
#
# O schema (tabelas) é criado e destruído pelo Hibernate a cada execução
# (ddl-auto=create-drop), e os dados vêm de testdata/10-dados-base.sql.

spring.datasource.url=jdbc:mariadb://localhost:3306/financas_test?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=0
